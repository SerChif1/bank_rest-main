spring:
  application:
    name: bank-cards-management

  datasource:
    url: jdbc:postgresql://localhost:5432/bank_db
    username: bank_user
    password: bank_pass

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/migration/master.xml
    enabled: true

logging:
  level:
    com.bank: DEBUG
    org.springframework.security: DEBUG

server:
  port: 8082
#
# application.yml — главный конфигурационный файл Spring Boot.

